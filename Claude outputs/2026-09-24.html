<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Read Quiz — 2026-09-24</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --line: #e4e0d6;
    --accent: #7c5cff;
    --accent-ink: #ffffff;
    --good: #1b8a5a;
    --good-bg: #e6f6ee;
    --bad: #c0392b;
    --bad-bg: #fbe9e7;
    --module-a: #7c5cff;
    --module-b: #ff8a3d;
    --module-c: #12ad9c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card: #1f2229;
      --ink: #eef0f4;
      --muted: #9aa1ad;
      --line: #2c3038;
      --good-bg: #123425;
      --bad-bg: #3a1f1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 16px 80px;
  }
  header.top {
    margin-bottom: 20px;
  }
  header.top h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 0.92rem;
  }
  .progress-track {
    height: 8px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
    margin: 18px 0 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.35s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    margin-top: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 3px 10px;
    border-radius: 99px;
    color: #fff;
    margin-bottom: 14px;
  }
  .badge.ICT3112 { background: var(--module-a); }
  .badge.ICT3113 { background: var(--module-b); }
  .badge.INF2005 { background: var(--module-c); }
  .qtext {
    font-size: 1.08rem;
    line-height: 1.5;
    margin: 0 0 18px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    text-align: left;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.96rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
    display: flex;
    gap: 10px;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:active:not(:disabled) { transform: scale(0.99); }
  .opt .letter {
    font-weight: 700;
    color: var(--muted);
    min-width: 18px;
  }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.correct .letter { color: var(--good); }
  .opt.incorrect { border-color: var(--bad); background: var(--bad-bg); }
  .opt.incorrect .letter { color: var(--bad); }
  .opt.dim { opacity: 0.55; }
  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 0.92rem;
    line-height: 1.5;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-bg); color: var(--good); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .feedback .exp { color: var(--ink); opacity: 0.85; display: block; margin-top: 6px; }
  .controls {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
  }
  button.next {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }
  button.next.show { display: inline-block; }
  button.next:hover { opacity: 0.9; }
  .results { text-align: center; }
  .score-ring {
    width: 140px; height: 140px;
    margin: 8px auto 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--line) 0);
  }
  .score-ring .inner {
    width: 112px; height: 112px;
    border-radius: 50%;
    background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score-ring .num { font-size: 1.7rem; font-weight: 700; }
  .score-ring .den { font-size: 0.8rem; color: var(--muted); }
  .breakdown {
    text-align: left;
    margin-top: 22px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .breakdown h3 { font-size: 0.95rem; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .mod-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; font-size: 0.92rem; border-bottom: 1px solid var(--line);
  }
  .mod-row:last-child { border-bottom: none; }
  .review-list { margin-top: 22px; text-align: left; }
  .review-item {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .review-item .q { font-weight: 600; margin-bottom: 4px; }
  .review-item .you { color: var(--bad); }
  .review-item .correct-ans { color: var(--good); }
  button.restart {
    margin-top: 24px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  button.restart:hover { background: var(--accent); color: var(--accent-ink); }
  .hint {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 6px;
  }
  .celebrate { font-size: 2rem; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Daily Read Quiz — 2026-09-24</h1>
    <div class="sub">ICT3112 · ICT3113 · INF2005 — 20 questions on yesterday's reading</div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label"><span id="progressLabel">Question 1 of 20</span><span id="scoreLabel">Score: 0</span></div>

  <div class="card" id="quizCard"></div>
</div>

<script id="quiz-data" type="application/json">[{"module": "ICT3112", "question": "A Control Flow Graph has 15 edges and 12 nodes. What is the Cyclomatic Complexity?", "options": ["3", "4", "5", "6"], "correct": 2, "explanation": "C = E − N + 2 = 15 − 12 + 2 = 5. Count edges and nodes carefully from the CFG before applying the formula."}, {"module": "ICT3112", "question": "Which of the following is the correct interpretation of a Cyclomatic Complexity value of 35?", "options": ["Simple, low risk — standard unit testing is sufficient", "Marginal, low risk — monitor but no immediate action required", "Complex, high risk — refactoring is strongly recommended", "Untestable, very high risk — the module cannot be tested"], "correct": 2, "explanation": "A C value of 21–50 falls in the \"complex, high risk\" band; refactoring is strongly recommended to reduce complexity before further testing."}, {"module": "ICT3112", "question": "A program has three decisions: an if, a while, and a switch with four cases. What is the minimum number of decision outcomes that must be covered for 100% Decision Coverage of the if and while alone?", "options": ["2", "3", "4", "6"], "correct": 2, "explanation": "Each decision has two outcomes (True and False). The if contributes 2 and the while contributes 2, giving 4 total outcomes that must each be exercised at least once."}, {"module": "ICT3112", "question": "A tester achieves 100% condition coverage on the expression if (A && B) using two test cases: (A=True, B=False) and (A=False, B=True). Which statement about branch coverage is correct?", "options": ["100% branch coverage is also achieved, since both sub-conditions were tested", "Branch coverage is not achieved — the True branch of the if was never executed", "Branch coverage is partially achieved — the False branch was tested twice", "Branch coverage is irrelevant when condition coverage is already at 100%"], "correct": 1, "explanation": "Both test cases route through the False branch (since A&&B is False in both). The True branch is never taken, so branch coverage is not achieved. Condition coverage does not subsume decision coverage."}, {"module": "ICT3112", "question": "Basis path testing using Cyclomatic Complexity guarantees which minimum coverage level?", "options": ["Statement coverage only", "Condition coverage", "Branch/Decision coverage", "Multiple Condition coverage"], "correct": 2, "explanation": "Basis path testing guarantees at least full branch/decision coverage. It does not guarantee condition coverage or multiple condition coverage."}, {"module": "ICT3112", "question": "A function accepts an integer in the range 1–50. An Equivalence Partitioning analysis identifies three partitions. How many test cases are needed as a minimum?", "options": ["1", "2", "3", "50"], "correct": 2, "explanation": "Three partitions (one invalid below, one valid, one invalid above) require a minimum of three test cases — one representative from each partition."}, {"module": "ICT3112", "question": "Which of the following best describes why Equivalence Partitioning should include invalid partitions in the test set?", "options": ["Invalid inputs are more likely to expose defects than valid inputs", "Testing one representative from each invalid partition covers the behaviour for the entire invalid range", "Invalid partitions must be tested exhaustively because representative sampling is unreliable there", "Invalid partitions are only required when testing at the system level, not at unit level"], "correct": 1, "explanation": "The logic of EP is that one representative covers the whole partition. This applies equally to invalid partitions; the invalid range is treated as a partition in its own right, requiring exactly one representative."}, {"module": "ICT3113", "question": "Little's Law states N = X × R. A stable system has a throughput of 5 requests per second and an average response time of 0.6 seconds. What is the average number of requests in the system?", "options": ["0.12", "3", "8.33", "30"], "correct": 1, "explanation": "N = X × R = 5 × 0.6 = 3 requests. Little's Law applies directly to stable systems with no further conditions."}, {"module": "ICT3113", "question": "In an M/M/1 queue, a server has a service time S = 50 ms and a traffic intensity ρ = 0.75. What is the average response time R?", "options": ["37.5 ms", "50 ms", "150 ms", "200 ms"], "correct": 3, "explanation": "R = S / (1−ρ) = 50 / (1 − 0.75) = 50 / 0.25 = 200 ms. The response time formula for M/M/1 includes both wait and service."}, {"module": "ICT3113", "question": "A single-server queue has λ = 8 jobs/s and μ = 10 jobs/s. What is the average wait time W in the queue?", "options": ["0.04 s", "0.1 s", "0.4 s", "0.5 s"], "correct": 2, "explanation": "ρ = λ/μ = 8/10 = 0.8; S = 1/μ = 0.1 s; W = ρ/(1−ρ) × S = (0.8/0.2) × 0.1 = 4 × 0.1 = 0.4 s."}, {"module": "ICT3113", "question": "A researcher observes four arrivals at times t = 1 s, 4 s, 7 s, 10 s within a 20-second window. What is the arrival rate λ?", "options": ["0.15 jobs/s", "0.20 jobs/s", "0.25 jobs/s", "0.33 jobs/s"], "correct": 1, "explanation": "λ = arrivals / window = 4 / 20 = 0.20 jobs/s. The mean inter-arrival gap (3 s) is not the same as 1/λ (5 s); always use the full observation window."}, {"module": "ICT3113", "question": "Using the Kingman formula, a single-server system has ρ = 0.9, S = 40 ms, Ca² = 1, and Cs² = 9. What is the approximate wait time W?", "options": ["360 ms", "900 ms", "1,800 ms", "3,600 ms"], "correct": 2, "explanation": "Utilisation term = ρ/(1−ρ) = 0.9/0.1 = 9. Variability term = (1+9)/2 = 5. W ≈ 9 × 5 × 40 = 1,800 ms."}, {"module": "ICT3113", "question": "In the Kingman formula, when Ca = Cs = 1, the result is equivalent to which classical model?", "options": ["M/D/1 (deterministic service)", "M/M/1 (Markov arrivals, exponential service)", "M/M/c (multi-server Markov)", "G/G/c (general multi-server)"], "correct": 1, "explanation": "When Ca = Cs = 1, the Kingman formula reduces exactly to the M/M/1 wait-time result, confirming M/M/1 is the special case of G/G/1 with unit coefficient of variation."}, {"module": "ICT3113", "question": "A system is observed with high tail latency (p99 = 4 s) at only 55% average utilisation. According to the Four Sources Framework, which root cause is most likely responsible?", "options": ["Demand — service demand D is too high", "Capacity — the throughput ceiling has been reached", "Variability — high Cs or Ca is inflating the queue", "Population — too many concurrent users are in the system"], "correct": 2, "explanation": "High tail latency at moderate utilisation is the textbook symptom of variability (high Cs or Ca inflating the queue via Kingman). Capacity problems manifest as throughput plateaus, not tail-latency spikes at low utilisation."}, {"module": "INF2005", "question": "In RSA key generation, for which computation is the modulus φ(n) used, rather than n?", "options": ["Encrypting the plaintext message", "Decrypting the ciphertext message", "Computing the private exponent d", "Verifying a digital signature"], "correct": 2, "explanation": "φ(n) is used only during key generation to compute d (the modular inverse of e). All encryption and decryption operations use modulus n."}, {"module": "INF2005", "question": "Given p = 7, q = 13 for RSA key generation, what is φ(n)?", "options": ["72", "78", "80", "91"], "correct": 0, "explanation": "n = 7 × 13 = 91; φ(n) = (7−1)(13−1) = 6 × 12 = 72."}, {"module": "INF2005", "question": "An RSA public key is (e = 5, n = 77). Which values make up the valid private key?", "options": ["(d = 5, n = 77)", "(d = 17, n = 77)", "(d = 53, n = 77)", "(d = 60, n = 77)"], "correct": 1, "explanation": "n = 77 = 7 × 11, φ(n) = 6 × 10 = 60. Private key = (d, n) where d is chosen to satisfy e·d ≡ 1 (mod φ(n)); the note's worked answer for this key pair is d = 17."}, {"module": "INF2005", "question": "Why does LSB steganography fail when applied to JPEG images?", "options": ["JPEG images use 16-bit colour depth, which is incompatible with single-bit embedding", "JPEG's lossy compression modifies pixel values during encoding, destroying the embedded bits", "JPEG files do not have a bit-plane structure and therefore cannot support LSB encoding", "JPEG applies lossless compression which averages adjacent pixels, erasing the payload"], "correct": 1, "explanation": "JPEG uses lossy compression (DCT followed by quantisation), which rounds and discards small coefficient values. Bits embedded at the pixel level are destroyed when the image is re-compressed as JPEG."}, {"module": "INF2005", "question": "Compared with LSB Replacement, what is the key advantage of LSB Matching?", "options": ["It can embed twice as many bits per pixel", "It works on JPEG images as well as lossless formats", "It is less detectable because it avoids the statistical asymmetry caused by hard bit-flipping", "It stores the payload in higher bit planes, making it invisible to all known steganalysis tools"], "correct": 2, "explanation": "LSB Matching randomly adds or subtracts 1 from the pixel value instead of hard-flipping the LSB, avoiding the detectable statistical asymmetry that LSB Replacement creates."}, {"module": "INF2005", "question": "A steganalyst applies a visual attack to a PNG image by mapping even pixel values to black and odd pixel values to white. What is this technique designed to detect?", "options": ["BPCS steganography in high-complexity bit planes", "LSB Replacement steganography, which creates structured patterns in the LSB plane", "Columnar transposition ciphers hidden in the image metadata", "LSB Matching steganography, which randomises pixel-value parities throughout the image"], "correct": 1, "explanation": "The even→black, odd→white visual attack is designed to reveal the structured patterns left by LSB Replacement; a clean or LSB-Matching image looks like random noise under this test."}]</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  const LETTERS = ['A', 'B', 'C', 'D'];
  let current = 0;
  let score = 0;
  let answered = [];
  const card = document.getElementById('quizCard');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const scoreLabel = document.getElementById('scoreLabel');

  function renderQuestion(i) {
    const q = DATA[i];
    progressFill.style.width = ((i) / DATA.length * 100) + '%';
    progressLabel.textContent = 'Question ' + (i + 1) + ' of ' + DATA.length;
    scoreLabel.textContent = 'Score: ' + score;

    let optsHtml = '';
    q.options.forEach((opt, idx) => {
      optsHtml += '<button class="opt" data-idx="' + idx + '"><span class="letter">' + LETTERS[idx] + '</span><span>' + opt + '</span></button>';
    });

    card.innerHTML =
      '<span class="badge ' + q.module + '">' + q.module + '</span>' +
      '<p class="qtext">' + q.question + '</p>' +
      '<div class="options">' + optsHtml + '</div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="controls"><button class="next" id="nextBtn">' + (i === DATA.length - 1 ? 'See results' : 'Next question') + '</button></div>';

    const buttons = card.querySelectorAll('.opt');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => selectOption(btn, q, buttons));
    });
  }

  function selectOption(btn, q, buttons) {
    const idx = parseInt(btn.getAttribute('data-idx'), 10);
    const correct = idx === q.correct;
    buttons.forEach(b => b.disabled = true);
    buttons.forEach((b, i2) => {
      if (i2 === q.correct) b.classList.add('correct');
      else if (b === btn) b.classList.add('incorrect');
      else b.classList.add('dim');
    });
    const fb = document.getElementById('feedback');
    fb.classList.add('show', correct ? 'good' : 'bad');
    fb.innerHTML = (correct ? 'Correct.' : 'Not quite — correct answer is ' + LETTERS[q.correct] + '.') +
      '<span class="exp">' + q.explanation + '</span>';
    if (correct) score++;
    answered.push({ index: current, correct: correct, chosen: idx });
    scoreLabel.textContent = 'Score: ' + score;
    document.getElementById('nextBtn').classList.add('show');
    document.getElementById('nextBtn').onclick = () => {
      current++;
      if (current < DATA.length) {
        renderQuestion(current);
      } else {
        renderResults();
      }
    };
  }

  function renderResults() {
    progressFill.style.width = '100%';
    progressLabel.textContent = 'Complete';
    scoreLabel.textContent = 'Score: ' + score + ' / ' + DATA.length;

    const pct = Math.round((score / DATA.length) * 100);
    const modules = {};
    DATA.forEach((q, i) => {
      modules[q.module] = modules[q.module] || { total: 0, correct: 0 };
      modules[q.module].total++;
      if (answered[i] && answered[i].correct) modules[q.module].correct++;
    });

    let modHtml = '';
    Object.keys(modules).forEach(m => {
      const s = modules[m];
      modHtml += '<div class="mod-row"><span><span class="badge ' + m + '">' + m + '</span></span><span>' + s.correct + ' / ' + s.total + '</span></div>';
    });

    let reviewHtml = '';
    const missed = answered.filter(a => !a.correct);
    if (missed.length) {
      reviewHtml = '<div class="review-list"><h3>Review the ones you missed</h3>';
      missed.forEach(a => {
        const q = DATA[a.index];
        reviewHtml += '<div class="review-item"><div class="q">' + q.question + '</div>' +
          '<div class="you">Your answer: ' + LETTERS[a.chosen] + ') ' + q.options[a.chosen] + '</div>' +
          '<div class="correct-ans">Correct: ' + LETTERS[q.correct] + ') ' + q.options[q.correct] + '</div>' +
          '<div class="hint">' + q.explanation + '</div></div>';
      });
      reviewHtml += '</div>';
    }

    let headline = 'Solid work.';
    let emoji = '📘';
    if (pct === 100) { headline = 'Perfect score.'; emoji = '🏆'; }
    else if (pct >= 85) { headline = 'Excellent recall.'; emoji = '🎯'; }
    else if (pct >= 60) { headline = 'Good, some gaps to revise.'; emoji = '📘'; }
    else { headline = 'Worth another pass through the notes.'; emoji = '📚'; }

    card.innerHTML =
      '<div class="results">' +
      '<div class="celebrate">' + emoji + '</div>' +
      '<div class="score-ring" style="--pct:' + pct + '"><div class="inner"><span class="num">' + score + '/' + DATA.length + '</span><span class="den">' + pct + '%</span></div></div>' +
      '<div style="font-weight:600;font-size:1.05rem;">' + headline + '</div>' +
      '<div class="breakdown"><h3>By module</h3>' + modHtml + '</div>' +
      reviewHtml +
      '<button class="restart" id="restartBtn">Retake quiz</button>' +
      '</div>';

    document.getElementById('restartBtn').onclick = () => {
      current = 0; score = 0; answered = [];
      renderQuestion(0);
    };
  }

  renderQuestion(0);
})();
</script>
</body>
</html>
