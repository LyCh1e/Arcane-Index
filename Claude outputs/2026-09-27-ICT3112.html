<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICT3112 Daily Quiz — 2026-09-27</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --line: #e4e0d6;
    --accent: #7c5cff;
    --accent-ink: #ffffff;
    --good: #1b8a5a;
    --good-bg: #e6f6ee;
    --bad: #c0392b;
    --bad-bg: #fbe9e7;
    --module-a: #7c5cff;
    --module-b: #ff8a3d;
    --module-c: #12ad9c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card: #1f2229;
      --ink: #eef0f4;
      --muted: #9aa1ad;
      --line: #2c3038;
      --good-bg: #123425;
      --bad-bg: #3a1f1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 16px 80px;
  }
  header.top {
    margin-bottom: 20px;
  }
  header.top h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 0.92rem;
  }
  .progress-track {
    height: 8px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
    margin: 18px 0 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.35s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    margin-top: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 3px 10px;
    border-radius: 99px;
    color: #fff;
    margin-bottom: 14px;
  }
  .badge.ICT3112 { background: var(--module-a); }
  .badge.ICT3113 { background: var(--module-b); }
  .badge.INF2005 { background: var(--module-c); }
  .qtext {
    font-size: 1.08rem;
    line-height: 1.5;
    margin: 0 0 18px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    text-align: left;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.96rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
    display: flex;
    gap: 10px;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:active:not(:disabled) { transform: scale(0.99); }
  .opt .letter {
    font-weight: 700;
    color: var(--muted);
    min-width: 18px;
  }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.correct .letter { color: var(--good); }
  .opt.incorrect { border-color: var(--bad); background: var(--bad-bg); }
  .opt.incorrect .letter { color: var(--bad); }
  .opt.dim { opacity: 0.55; }
  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 0.92rem;
    line-height: 1.5;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-bg); color: var(--good); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .feedback .exp { color: var(--ink); opacity: 0.85; display: block; margin-top: 6px; }
  .controls {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
  }
  button.next {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }
  button.next.show { display: inline-block; }
  button.next:hover { opacity: 0.9; }
  .results { text-align: center; }
  .score-ring {
    width: 140px; height: 140px;
    margin: 8px auto 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--line) 0);
  }
  .score-ring .inner {
    width: 112px; height: 112px;
    border-radius: 50%;
    background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score-ring .num { font-size: 1.7rem; font-weight: 700; }
  .score-ring .den { font-size: 0.8rem; color: var(--muted); }
  .breakdown {
    text-align: left;
    margin-top: 22px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .breakdown h3 { font-size: 0.95rem; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .mod-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; font-size: 0.92rem; border-bottom: 1px solid var(--line);
  }
  .mod-row:last-child { border-bottom: none; }
  .review-list { margin-top: 22px; text-align: left; }
  .review-item {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .review-item .q { font-weight: 600; margin-bottom: 4px; }
  .review-item .you { color: var(--bad); }
  .review-item .correct-ans { color: var(--good); }
  button.restart {
    margin-top: 24px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  button.restart:hover { background: var(--accent); color: var(--accent-ink); }
  .hint {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 6px;
  }
  .celebrate { font-size: 2rem; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>ICT3112 Daily Quiz — 2026-09-27</h1>
    <div class="sub">The Seven ISTQB Principles · Boundary Value Analysis · Basic Musa Reliability Model</div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label"><span id="progressLabel">Question 1 of 20</span><span id="scoreLabel">Score: 0</span></div>

  <div class="card" id="quizCard"></div>
</div>

<script id="quiz-data" type="application/json">[{"module": "ICT3112", "question": "Which ISTQB principle explains why running the same unchanged regression suite eventually stops catching new bugs?", "options": ["Defect clustering", "Pesticide paradox", "Absence-of-errors fallacy", "Exhaustive testing is impossible"], "correct": 1, "explanation": "The pesticide paradox describes an unchanged suite losing its power to find new defects over repeated runs; defect clustering is about where defects live, not test-suite staleness."}, {"module": "ICT3112", "question": "According to the \"defect clustering\" principle, testers should focus effort using which approach?", "options": ["Test every module with equal intensity", "Risk-based prioritisation of the small proportion of modules producing most defects", "Random sampling of test cases across the whole codebase", "Testing only after the software has been released"], "correct": 1, "explanation": "Defect clustering justifies risk-based testing: concentrate effort on the small proportion of modules historically responsible for most defects."}, {"module": "ICT3112", "question": "The \"absence-of-errors fallacy\" principle warns against which mistaken belief?", "options": ["That testing can prove there are zero defects", "That a defect-free system is automatically fit for purpose and useful", "That early testing is cheaper than late testing", "That testing is context-dependent"], "correct": 1, "explanation": "The absence-of-errors fallacy is specifically about usefulness, not provability: a bug-free system that solves the wrong problem is still a failure."}, {"module": "ICT3112", "question": "Which statement correctly reflects the \"exhaustive testing is impossible\" principle?", "options": ["Testing must cover every possible input combination", "Risk analysis should determine where to focus limited testing effort, since testing everything is not feasible", "Testing exhaustively guarantees zero defects", "Exhaustive testing is required only for safety-critical systems"], "correct": 1, "explanation": "Exhaustive testing being impossible is precisely why risk analysis must guide where limited testing effort goes."}, {"module": "ICT3112", "question": "\"Early testing saves cost\" reflects which broader testing philosophy?", "options": ["Shift left — finding defects before they become embedded and expensive to fix", "Shift right — testing in production to catch real user issues", "Big-bang testing at the very end of the project", "Outsourcing testing to reduce cost"], "correct": 0, "explanation": "Early testing embodies the shift-left philosophy: catching defects earlier, when they are cheaper to fix."}, {"module": "ICT3112", "question": "Which principle states that testing strategy must differ between, for example, a safety-critical medical device and a marketing website?", "options": ["Defect clustering", "Testing is context-dependent", "Pesticide paradox", "Absence-of-errors fallacy"], "correct": 1, "explanation": "\"Testing is context-dependent\" is the principle that different domains (safety-critical vs. low-risk) need different testing rigour."}, {"module": "ICT3112", "question": "Which mnemonic is used to remember all seven ISTQB principles in order?", "options": ["KTB", "UDPC", "\"Teach Every Eager Developer Proper Testing Approaches\"", "LRRECI"], "correct": 2, "explanation": "\"Teach Every Eager Developer Proper Testing Approaches\" is the seven-principle mnemonic; KTB and UDPC belong to INF2005's authentication and biometrics topics."}, {"module": "ICT3112", "question": "For a valid input range of 0–100, which pair of values represents \"extended BVA\" as opposed to the basic four boundary values?", "options": ["−1 and 101", "0 and 100", "1 and 99", "50 and 51"], "correct": 2, "explanation": "1 and 99 are the \"one step inside\" values that extended BVA adds on top of the basic four (−1, 0, 100, 101)."}, {"module": "ICT3112", "question": "Why should ASCII-boundary tests and string-length-boundary tests for the same field be run as separate test cases?", "options": ["To reduce the total number of test cases needed", "So a failure can be attributed to the specific boundary that caused it", "Because ASCII and length boundaries can never both be invalid at once", "Because BVA does not apply to string fields"], "correct": 1, "explanation": "Combining two boundary dimensions in one test case makes a failure ambiguous; separating them isolates the cause."}, {"module": "ICT3112", "question": "BVA rule 2 states that when no range is specified for an input, what should be tested?", "options": ["Only the maximum value", "The min and max of the domain, plus one value below and one above", "Only the domain's average value", "No boundary testing is needed at all"], "correct": 1, "explanation": "With no specified range, BVA rule 2 says to use the domain's min and max plus one value beyond each."}, {"module": "ICT3112", "question": "BVA rule 3 states that for sets of values, you should test each value and:", "options": ["Only the value in the middle of the set", "The size of the set — for files, the first and last records", "Only the invalid members of the set", "No further boundary testing is needed for sets"], "correct": 1, "explanation": "Rule 3 covers sets and files: test each value plus the set's size boundary (first/last record for files)."}, {"module": "ICT3112", "question": "For the \"First Name\" field example (1–10 capital letters), which test value is an invalid ASCII boundary rather than a length boundary?", "options": ["\"G\" (1 character)", "\"BORDERNAME\" (10 characters)", "\"@\" (ASCII 64, just below 'A')", "null / empty"], "correct": 2, "explanation": "\"@\" (ASCII 64) is just below 'A' — an invalid ASCII/character boundary, distinct from the length boundaries in the other options."}, {"module": "ICT3112", "question": "BVA is explicitly described in the notes as complementary to which other blackbox technique?", "options": ["Decision Table Testing", "State Transition Testing", "Equivalence Partitioning", "Use Case Testing"], "correct": 2, "explanation": "BVA is presented as complementary to Equivalence Partitioning: EP samples inside partitions, BVA targets their edges."}, {"module": "ICT3112", "question": "BVA rule 4 (\"test any extreme input or output\") exists mainly to catch students who:", "options": ["Only think about output conditions, ignoring inputs", "Only think about input ranges, ignoring output boundary conditions", "Test too many boundary values", "Skip invalid partitions entirely"], "correct": 1, "explanation": "Students commonly only consider input ranges; rule 4 is a reminder that output conditions and extremes need boundary testing too."}, {"module": "ICT3112", "question": "In the Basic Musa reliability model, what does the parameter ν₀ represent?", "options": ["The current failure intensity", "The total number of failures expected over the software's life", "The elapsed time since testing began", "The number of testers assigned to the project"], "correct": 1, "explanation": "ν₀ is the total expected failure count over the software's life; λ(τ) is the instantaneous rate, not the total."}, {"module": "ICT3112", "question": "The Basic Musa model assumes which pattern in failure intensity as faults are fixed?", "options": ["It decreases by a constant amount per fault fixed (constant rate of decrease)", "It stays constant regardless of fixes", "It increases logarithmically over time", "It resets to λ₀ after every fix"], "correct": 0, "explanation": "The Basic model's defining assumption is a constant rate of decrease in failure intensity per fault fixed, unlike the Logarithmic model."}, {"module": "ICT3112", "question": "Using λ₀ = 2, ν₀ = 10, τ = 5, what is λ(5)?", "options": ["0.368", "0.736", "1.472", "2.000"], "correct": 1, "explanation": "λ(5) = λ₀ × e^(−λ₀τ/ν₀) = 2 × e⁻¹ ≈ 0.736."}, {"module": "ICT3112", "question": "Using the same parameters (λ₀ = 2, ν₀ = 10, τ = 5), what is μ(5), the expected cumulative number of failures?", "options": ["3.68", "5.00", "6.32", "10.00"], "correct": 2, "explanation": "μ(5) = ν₀ × [1 − e^(−λ₀τ/ν₀)] = 10 × (1 − e⁻¹) ≈ 6.32."}, {"module": "ICT3112", "question": "The Basic Musa model is best suited to which kind of release?", "options": ["Early-stage releases with highly uneven fault severity", "Stable, mature releases with evenly distributed fault severity", "Releases with zero known defects", "Releases that have not yet started testing"], "correct": 1, "explanation": "The Basic model's constant-rate assumption fits stable, mature releases best, where fault severity is roughly even."}, {"module": "ICT3112", "question": "How does the Basic Musa model differ from the Logarithmic Musa model?", "options": ["The Basic model assumes failure intensity decreases logarithmically; the Logarithmic model assumes a constant rate", "The Basic model assumes a constant rate of decrease per fault fixed; the Logarithmic model assumes early faults are more severe, decreasing intensity logarithmically", "They are mathematically identical, differing only in notation", "The Basic model applies only to hardware reliability, not software"], "correct": 1, "explanation": "Basic assumes a constant rate of decrease; Logarithmic assumes early faults are more severe, so intensity falls logarithmically rather than linearly with each fix."}]</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  const LETTERS = ['A', 'B', 'C', 'D'];
  let current = 0;
  let score = 0;
  let answered = [];
  const card = document.getElementById('quizCard');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const scoreLabel = document.getElementById('scoreLabel');

  function renderQuestion(i) {
    const q = DATA[i];
    progressFill.style.width = ((i) / DATA.length * 100) + '%';
    progressLabel.textContent = 'Question ' + (i + 1) + ' of ' + DATA.length;
    scoreLabel.textContent = 'Score: ' + score;

    let optsHtml = '';
    q.options.forEach((opt, idx) => {
      optsHtml += '<button class="opt" data-idx="' + idx + '"><span class="letter">' + LETTERS[idx] + '</span><span>' + opt + '</span></button>';
    });

    card.innerHTML =
      '<span class="badge ' + q.module + '">' + q.module + '</span>' +
      '<p class="qtext">' + q.question + '</p>' +
      '<div class="options">' + optsHtml + '</div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="controls"><button class="next" id="nextBtn">' + (i === DATA.length - 1 ? 'See results' : 'Next question') + '</button></div>';

    const buttons = card.querySelectorAll('.opt');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => selectOption(btn, q, buttons));
    });
  }

  function selectOption(btn, q, buttons) {
    const idx = parseInt(btn.getAttribute('data-idx'), 10);
    const correct = idx === q.correct;
    buttons.forEach(b => b.disabled = true);
    buttons.forEach((b, i2) => {
      if (i2 === q.correct) b.classList.add('correct');
      else if (b === btn) b.classList.add('incorrect');
      else b.classList.add('dim');
    });
    const fb = document.getElementById('feedback');
    fb.classList.add('show', correct ? 'good' : 'bad');
    fb.innerHTML = (correct ? 'Correct.' : 'Not quite — correct answer is ' + LETTERS[q.correct] + '.') +
      '<span class="exp">' + q.explanation + '</span>';
    if (correct) score++;
    answered.push({ index: current, correct: correct, chosen: idx });
    scoreLabel.textContent = 'Score: ' + score;
    document.getElementById('nextBtn').classList.add('show');
    document.getElementById('nextBtn').onclick = () => {
      current++;
      if (current < DATA.length) {
        renderQuestion(current);
      } else {
        renderResults();
      }
    };
  }

  function renderResults() {
    progressFill.style.width = '100%';
    progressLabel.textContent = 'Complete';
    scoreLabel.textContent = 'Score: ' + score + ' / ' + DATA.length;

    const pct = Math.round((score / DATA.length) * 100);
    const modules = {};
    DATA.forEach((q, i) => {
      modules[q.module] = modules[q.module] || { total: 0, correct: 0 };
      modules[q.module].total++;
      if (answered[i] && answered[i].correct) modules[q.module].correct++;
    });

    let modHtml = '';
    Object.keys(modules).forEach(m => {
      const s = modules[m];
      modHtml += '<div class="mod-row"><span><span class="badge ' + m + '">' + m + '</span></span><span>' + s.correct + ' / ' + s.total + '</span></div>';
    });

    let reviewHtml = '';
    const missed = answered.filter(a => !a.correct);
    if (missed.length) {
      reviewHtml = '<div class="review-list"><h3>Review the ones you missed</h3>';
      missed.forEach(a => {
        const q = DATA[a.index];
        reviewHtml += '<div class="review-item"><div class="q">' + q.question + '</div>' +
          '<div class="you">Your answer: ' + LETTERS[a.chosen] + ') ' + q.options[a.chosen] + '</div>' +
          '<div class="correct-ans">Correct: ' + LETTERS[q.correct] + ') ' + q.options[q.correct] + '</div>' +
          '<div class="hint">' + q.explanation + '</div></div>';
      });
      reviewHtml += '</div>';
    }

    let headline = 'Solid work.';
    let emoji = '📘';
    if (pct === 100) { headline = 'Perfect score.'; emoji = '🏆'; }
    else if (pct >= 85) { headline = 'Excellent recall.'; emoji = '🎯'; }
    else if (pct >= 60) { headline = 'Good, some gaps to revise.'; emoji = '📘'; }
    else { headline = 'Worth another pass through the notes.'; emoji = '📚'; }

    card.innerHTML =
      '<div class="results">' +
      '<div class="celebrate">' + emoji + '</div>' +
      '<div class="score-ring" style="--pct:' + pct + '"><div class="inner"><span class="num">' + score + '/' + DATA.length + '</span><span class="den">' + pct + '%</span></div></div>' +
      '<div style="font-weight:600;font-size:1.05rem;">' + headline + '</div>' +
      '<div class="breakdown"><h3>By module</h3>' + modHtml + '</div>' +
      reviewHtml +
      '<button class="restart" id="restartBtn">Retake quiz</button>' +
      '</div>';

    document.getElementById('restartBtn').onclick = () => {
      current = 0; score = 0; answered = [];
      renderQuestion(0);
    };
  }

  renderQuestion(0);
})();
</script>
</body>
</html>
